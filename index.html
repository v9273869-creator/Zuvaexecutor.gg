<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Mobile Executor</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --panel-bg: #16192b;
            --border-color: #2a2f4c;
            --accent-color: #7928ca;
            --accent-glow: rgba(121, 40, 202, 0.4);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .executor-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        .card-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(22, 25, 43, 0.7);
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c084fc;
        }

        .editor-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .floating-top-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #7928ca, #4f46e5);
            color: white;
            border: none;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .floating-top-btn:active {
            transform: scale(0.92);
        }

        .action-bar {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 15, 24, 0.6);
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-run {
            background-color: var(--success-color);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-clear {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .console-section {
            border-top: 1px solid var(--border-color);
            background-color: #090a0f;
            display: flex;
            flex-direction: column;
        }

        .console-header {
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .console-box {
            height: 90px;
            padding: 10px 16px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            color: #34d399;
        }
    </style>
</head>
<body>

    <div class="executor-card">
        <div class="card-header">
            <div class="title">
                <span>⚡</span> Mobile Script Executor
            </div>
        </div>

        <div class="editor-wrapper">
            <!-- ปุ่มลอยมุมขวาบน สำหรับรันด่วน -->
            <button class="floating-top-btn" onclick="quickAction()" title="Quick Execute">
                🚀
            </button>
            <textarea id="scriptInput" placeholder="// วางสคริปต์ของคุณที่นี่... (ระบบบันทึกให้อัตโนมัติ)"></textarea>
        </div>

        <div class="action-bar">
            <div class="button-group">
                <button class="btn btn-run" onclick="runScript()">▶ รัน</button>
                <button class="btn btn-clear" onclick="clearConsole()">🗑 ลบ</button>
                <button class="btn btn-secondary" onclick="pasteCode()">📋 วาง</button>
            </div>
        </div>

        <div class="console-section">
            <div class="console-header">
                <span>CONSOLE OUTPUT</span>
                <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 10px;" onclick="copyConsole()">คัดลอกผลลัพธ์</button>
            </div>
            <div class="console-box" id="consoleOutput">
                > คอนโซลพร้อมใช้งาน...
            </div>
        </div>
    </div>

    <script>
        // 1. ระบบจำสคริปต์ล่าสุด (โหลดข้อมูลเดิมตอนเปิดเว็บ)
        window.addEventListener('DOMContentLoaded', () => {
            const savedScript = localStorage.getItem('saved_executor_script');
            if (savedScript) {
                document.getElementById('scriptInput').value = savedScript;
                log("โหลดสคริปต์ล่าสุดจากความจำเครื่องสำเร็จ");
            }
        });

        // บันทึกสคริปต์อัตโนมัติทันทีที่มีการพิมพ์
        document.getElementById('scriptInput').addEventListener('input', (e) => {
            localStorage.setItem('saved_executor_script', e.target.value);
        });

        function log(msg, isErr = false) {
            const box = document.getElementById('consoleOutput');
            const div = document.createElement('div');
            div.style.color = isErr ? '#f87171' : '#34d399';
            div.textContent = `> ${msg}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('consoleOutput').innerHTML = '> คอนโซลถูกล้างแล้ว';
        }

        // 2. ฟังก์ชันปุ่มวางโค้ด (Paste)
        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                const textarea = document.getElementById('scriptInput');
                textarea.value = text;
                localStorage.setItem('saved_executor_script', text);
                log("วางโค้ดจากคลิปบอร์ดสำเร็จ");
            } catch (err) {
                log("เบราว์เซอร์ไม่อนุญาตให้อ่านคลิปบอร์ดอัตโนมัติ (โปรดใช้วิธีแตะค้างแล้วกดวาง)", true);
            }
        }

        // 3. ฟังก์ชันปุ่มคัดลอก Console
        function copyConsole() {
            const box = document.getElementById('consoleOutput');
            const text = box.innerText;
            navigator.clipboard.writeText(text).then(() => {
                log("คัดลอกข้อความใน Console สำเร็จ!");
            }).catch(() => {
                log("คัดลอกไม่สำเร็จ", true);
            });
        }

        function quickAction() {
            runScript();
        }

        function runScript() {
            const code = document.getElementById('scriptInput').value;
            if(!code.trim()) {
                log("กรุณาใส่โค้ดก่อนรัน", true);
                return;
            }
            clearConsole();
            
            const origLog = console.log;
            console.log = (...args) => {
                log(args.join(' '));
                origLog(...args);
            };

            try {
                const res = eval(code);
                if(res !== undefined) {
                    log(`ผลลัพธ์: ${res}`);
                } else {
                    log("รันสคริปต์สำเร็จ!");
                }
            } catch (err) {
                log(err.message, true);
            } finally {
                console.log = origLog;
            }
        }
    </script>
</body>
</html>
